version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: s3-upload-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: s3upload
      POSTGRES_PASSWORD: s3upload123
      POSTGRES_DB: s3_uploads
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s3upload -d s3_uploads"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
